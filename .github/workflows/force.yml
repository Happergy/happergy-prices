# .github/workflows/scheduled-builds.yml
name: Force refresh data


on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to use for PVPC (YYYYMMDD or YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  build:
    name: Prepare data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js 🚀
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun 📦
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - uses: actions/cache@v4
        name: Setup Bun cache 🗄️
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies 📦
        run: bun install --frozen-lockfile

      - name: Type-check TypeScript
        run: bun run typecheck

      - name: Fetch PVPC prices
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            bun run sh/pvpc.ts "${{ github.event.inputs.date }}"
          else
            bun run sh/pvpc.ts
          fi

      - name: Update prices
        run: bun run prices

      - name: Commit changes 📝
        uses: EndBug/add-and-commit@v9 
        with:
          fetch: true
          message: "Force updated prices"
          pull: "--rebase --autostash"
